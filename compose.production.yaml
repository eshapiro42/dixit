services:
  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      REDIS_URL: redis://redis:6379/0
      CARDS_DIR: /app/cards
      MIN_HUMAN_PLAYERS: ${MIN_HUMAN_PLAYERS:-3}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile.production
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
