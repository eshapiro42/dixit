[project]
name = "dixit"
version = "0.1.0"
description = "Dixit Backend"
authors = [
    { name = "eshapiro42", email = "eshapiro42@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "eventlet>=0.41.2",
    "flask>=3.1.3",
    "flask-socketio>=5.6.1",
    "gunicorn>=26.2.0",
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.38.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
