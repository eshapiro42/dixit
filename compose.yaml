services:
  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      REDIS_URL: redis://redis:6379/0
      CARDS_DIR: /app/cards
      MIN_HUMAN_PLAYERS: ${MIN_HUMAN_PLAYERS:-3}
    volumes:
      - ./backend:/app
      - ./cards:/app/cards
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  redis_data:
  frontend_node_modules:
